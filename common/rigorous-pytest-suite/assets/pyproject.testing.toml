# Testing & quality tooling — merge these sections into your project's pyproject.toml.
# Replace `yourpackage` with the actual package name/path.

[dependency-groups]
dev = [
    "prek>=0.5.0",
    "pytest>=8.0",
    "ruff>=0.16",
    "ty>=0.0.77",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # drop this line if the package is always installed editable
addopts = "--strict-markers -ra"
markers = [
    "slow: marks tests as slow-running",
    "integration: marks tests that require an installed optional dependency",
]

[tool.coverage.run]
source = ["src/yourpackage"]
omit = [
    "src/yourpackage/__main__.py",
    # add other thin CLI/GUI wrapper entrypoints here, named explicitly
]

[tool.coverage.report]
omit = [
    "src/yourpackage/__main__.py",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle — enforces the docstring-per-test convention
    "E",   # pycodestyle errors
    "ERA", # eradicate: commented-out code
    "F",   # pyflakes
    "FA",  # flake8-future-annotations
    "I",   # isort
    "ICN", # flake8-import-conventions
    "N",   # pep8-naming
    "PL",  # pylint
    "PTH", # flake8-use-pathlib
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",    # line-too-long: the formatter already wraps what it safely can
    "PLR0913", # too-many-arguments: common and fine for config-heavy constructors
    "PLR2004", # magic-value-in-comparison: too noisy for numeric/scientific code
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
include = ["src", "tests"]
