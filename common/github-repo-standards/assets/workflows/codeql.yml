# CodeQL — free static security analysis from GitHub, scanning for common
# vulnerability patterns on every push/PR to main and on a weekly schedule.
# Set "language" to match the project; CodeQL supports multiple languages in
# one matrix if the repo is polyglot.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        # TODO: set to the project's language(s), e.g. ["python"], ["javascript-typescript"]
        language: ["TODO"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
