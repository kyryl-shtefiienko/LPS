# lint.yml — research-software profile (github-repo-standards skill).
# Mirrors the .pre-commit-config.yaml hook set (ruff check, ruff format, ty)
# so CI enforces exactly what pre-commit / prek enforce locally.
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uvx ty check
